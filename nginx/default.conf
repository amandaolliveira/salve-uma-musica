server {
    listen 80;
    resolver 127.0.0.11 valid=30s; # DNS do Docker

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # O Deezer não libera CORS, então o navegador chama /deezer/... e o nginx repassa
    # Ex.: /deezer/chart/152/tracks -> https://api.deezer.com/chart/152/tracks
    location /deezer/ {
        set $deezer https://api.deezer.com;
        rewrite ^/deezer/(.*)$ /$1 break;
        proxy_pass $deezer;
        proxy_set_header Host api.deezer.com;
        proxy_ssl_server_name on;
    }
}
