services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017" # Opcional: acessar pelo MongoDB Compass
    volumes:
      - dados-mongo:/data/db # Os dados continuam salvos ao reiniciar

  restheart:
    image: softinstigate/restheart:8
    depends_on:
      - mongodb
    environment:
      RHO: '/mclient/connection-string->"mongodb://mongodb:27017";/http-listener/host->"0.0.0.0"'
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    depends_on:
      - restheart
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Proxy pro Deezer

volumes:
  dados-mongo: